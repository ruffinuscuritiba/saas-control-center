# ─────────────────────────────────────────────────────────────────────────────
# CD — Deploy automático do SaaS Control Center para o VPS Hostinger
#
# Dispara em todo push em `main`. Faz SSH no VPS e recria o container a
# partir do projeto docker-compose REAL de produção, em
# /docker/saas-control-center (achado ao vivo via inspeção do container
# scc-app já rodando — mesmo VPS que hospeda FoodSaaS/Moda/Oficina/SBE,
# na rede Traefik `proxy`, roteado por Host(`admin.<domínio>`)).
#
# O compose builda direto do GitHub (mesmo padrão do FoodSaaS), então este
# job só faz `docker compose build && up -d`, sem clone local.
#
# Secrets obrigatórios (Settings → Secrets → Actions neste repo):
#   VPS_HOST      → srv1747711.hstgr.cloud
#   VPS_USER      → root
#   VPS_SSH_KEY   → mesma chave ed25519 usada pelo FoodSaaS (~/.ssh/foodsaas_vps)
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy → VPS

on:
  push:
    branches: [main]

concurrency:
  group: deploy-scc
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy no VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 600s
          script: |
            set -e

            echo "▶ Indo para o projeto real de produção..."
            cd /docker/saas-control-center

            echo "▶ Buildando imagem nova (build context = GitHub main, --no-cache obrigatório: build context remoto via git URL reusa o clone antigo em cache e nunca pega commit novo sem isso — achado ao vivo em 21/08/2026)..."
            docker compose build --no-cache scc-app

            echo "▶ Recriando container via docker compose (preserva labels Traefik + rede proxy)..."
            docker compose up -d --force-recreate scc-app

            echo "▶ Aguardando app subir..."
            sleep 10

            docker ps --filter "name=scc-app" --format "table {{.Names}}\t{{.Status}}"
            echo "✅ Deploy concluído!"
